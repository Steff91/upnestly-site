# Sveltia CMS (Decap-compatible). Login method for the GitHub backend:
# verify the current options in the Sveltia docs before handing over.
backend:
  name: github
  repo: Steff91/upnestly-site
  branch: main

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: settings
    label: Settings
    files:
      - name: site
        label: Site & contact
        file: src/data/site.json
        fields:
          - { name: name, label: Name, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: auditUrl, label: "Audit page path (German pages add /de automatically)", widget: string }
          - { name: contactUrl, label: "Contact page path", widget: string }
          - { name: formAction, label: "Form endpoint (Formspree / Web3Forms); empty = opens email app", widget: string, required: false }
          - { name: legalName, label: Legal entity name, widget: string }
          - { name: address, label: Street and number, widget: string }
          - { name: postalCode, label: Postal code, widget: string }
          - { name: registrationNumber, label: Registration number (MB), widget: string }
          - { name: vatId, label: VAT / tax ID (PIB), widget: string }
          - { name: register, label: Business register, widget: string }
          - { name: phone, label: Phone (imprint), widget: string }
          - { name: representedBy, label: Represented by (imprint), widget: string }
          - { name: responsiblePerson, label: Responsible for content, widget: string }
          - { name: linkedin, label: LinkedIn URL, widget: string, required: false }
          - { name: github, label: GitHub URL, widget: string, required: false }

      - name: site_en
        label: Site texts (EN)
        file: src/data/en/site.json
        fields: &site_text_fields
          - { name: tagline, label: Tagline, widget: string }
          - { name: description, label: Meta description, widget: text }
          - { name: city, label: City, widget: string }
          - { name: country, label: Country, widget: string }
          - { name: languages, label: Languages, widget: list }
          - { name: topbarMessage, label: Top bar message, widget: string }
          - { name: hours, label: Working hours (top bar), widget: string }
      - name: site_de
        label: Site texts (DE)
        file: src/data/de/site.json
        fields: *site_text_fields

      - name: plans
        label: Plans & pricing (EN)
        file: src/data/en/plans.json
        fields: &plans_fields
          - { name: title, label: Section title, widget: string }
          - { name: intro, label: Intro, widget: text }
          - { name: footnote, label: Footnote (VAT, term, …), widget: text }
          - name: plans
            label: Plans
            widget: list
            fields:
              - { name: name, label: Name, widget: string }
              - { name: price, label: Price, widget: string }
              - { name: period, label: Period, widget: string, required: false }
              - { name: blurb, label: Who it's for, widget: text }
              - { name: featured, label: Highlight, widget: boolean, default: false }
              - { name: cta, label: Button text, widget: string }
              - name: groups
                label: Included
                widget: list
                fields:
                  - { name: label, label: Label (Web / Growth / Apps / Ops), widget: string }
                  - { name: items, label: Items, widget: list }
      - name: plans_de
        label: Plans & pricing (DE)
        file: src/data/de/plans.json
        fields: *plans_fields

  - name: pricing
    label: Pricing page
    files:
      # The comparison table ("compare") mixes true/false and text values — edit it in the JSON files.
      # Keep annualDiscount the same in both languages.
      - name: pricing
        label: Discount, add-ons, terms & FAQ (EN)
        file: src/data/en/pricing.json
        fields: &pricing_fields
          - { name: annualDiscount, label: Annual discount (%), widget: number, value_type: int }
          - name: examples
            label: What a month can look like
            widget: list
            fields: [{ name: plan, label: Plan, widget: string }, { name: title, label: Title, widget: string }, { name: text, label: Example, widget: text }]
          - name: addons
            label: Bigger projects (fixed price)
            widget: list
            fields: [{ name: title, label: Title, widget: string }, { name: price, label: Price, widget: string }, { name: unit, label: Unit, widget: string }, { name: text, label: Text, widget: text }]
          - name: terms
            label: Billing terms
            widget: list
            fields: [{ name: title, label: Title, widget: string }, { name: text, label: "Text ({discount} = annual discount)", widget: text }]
          - name: faq
            label: FAQ
            widget: list
            fields: [{ name: q, label: Question, widget: string }, { name: a, label: Answer, widget: text }]
      - name: pricing_de
        label: Discount, add-ons, terms & FAQ (DE)
        file: src/data/de/pricing.json
        fields: *pricing_fields

  - name: team
    label: Team page
    files:
      - name: team
        label: Members, how we work, values, network (EN)
        file: src/data/en/team.json
        fields: &team_fields
          - name: members
            label: Members
            widget: list
            fields:
              - { name: name, label: Name, widget: string }
              - { name: role, label: Role, widget: string }
              - { name: discipline, label: Discipline, widget: select, options: [Web, Growth, Apps, Ops] }
              - { name: years, label: Experience, widget: string }
              - { name: photo, label: Portrait, widget: image, required: false }
              - { name: bio, label: Bio, widget: text }
              - { name: focus, label: Focus areas, widget: list }
              - { name: linkedin, label: LinkedIn URL, widget: string, required: false }
          - name: howWeWork
            label: How we work together
            widget: list
            fields: [{ name: title, label: Title, widget: string }, { name: text, label: Text, widget: text }]
          - name: values
            label: Values
            widget: list
            fields: [{ name: title, label: Title, widget: string }, { name: text, label: Text, widget: text }]
          - name: network
            label: Extended network
            widget: object
            fields: [{ name: text, label: Text, widget: text }, { name: items, label: Specialists, widget: list }]
      - name: team_de
        label: Members, how we work, values, network (DE)
        file: src/data/de/team.json
        fields: *team_fields

  # Content collections: one folder per language. Use the same file name in both
  # languages (e.g. en/cro-ads.md and de/cro-ads.md) — it is the URL slug.
  - name: services
    label: Services (EN)
    folder: src/content/services/en
    create: true
    slug: "{{slug}}"
    fields: &service_fields
      - { name: title, label: Title, widget: string }
      - { name: order, label: Order, widget: number, value_type: int }
      - { name: discipline, label: Discipline, widget: select, options: [Web, Growth, Apps, Ops] }
      - { name: excerpt, label: Short description (cards), widget: text }
      - { name: metaTitle, label: Meta title, widget: string }
      - { name: metaDescription, label: Meta description, widget: text }
      - { name: heroTitle, label: H1, widget: string }
      - { name: heroText, label: Hero text, widget: text }
      - { name: painsTitle, label: Pains heading, widget: string, required: false }
      - name: pains
        label: Pains
        widget: list
        fields: [{ name: title, label: Title, widget: string }, { name: text, label: Text, widget: text }]
      - { name: deliverablesTitle, label: Deliverables heading, widget: string, required: false }
      - name: deliverables
        label: What we do
        widget: list
        fields: [{ name: title, label: Title, widget: string }, { name: text, label: Text, widget: text }]
      - name: inPlans
        label: In each plan
        widget: object
        fields:
          - { name: essentials, label: Essentials, widget: text }
          - { name: growth, label: Growth, widget: text }
          - { name: scale, label: Scale, widget: text }
      - name: steps
        label: How we work
        widget: list
        fields: [{ name: title, label: Title, widget: string }, { name: text, label: Text, widget: text }]
      - { name: tools, label: Tools, widget: list, required: false }
      - { name: relatedWork, label: Related case study (file name), widget: string, required: false }
      - name: faq
        label: FAQ
        widget: list
        fields: [{ name: q, label: Question, widget: string }, { name: a, label: Answer, widget: text }]

  - name: services_de
    label: Services (DE)
    folder: src/content/services/de
    create: true
    slug: "{{slug}}"
    fields: *service_fields

  - name: legal
    label: Legal pages (EN)
    folder: src/content/legal/en
    create: false
    fields: &legal_fields
      - { name: title, label: Title, widget: string }
      - { name: description, label: Meta description, widget: text }
      - { name: updated, label: Last updated, widget: string }
      - { name: noindex, label: Hide from search engines, widget: boolean, default: true }
      - { name: body, label: Content, widget: markdown }

  - name: legal_de
    label: Legal pages (DE)
    folder: src/content/legal/de
    create: false
    fields: *legal_fields

  - name: work
    label: Case studies (EN)
    folder: src/content/work/en
    create: true
    slug: "{{slug}}"
    fields: &work_fields
      - { name: title, label: Title, widget: string }
      - { name: client, label: Client, widget: string }
      - { name: order, label: Order, widget: number, value_type: int }
      - { name: featured, label: Show on homepage, widget: boolean, default: false }
      - { name: industry, label: Industry, widget: string }
      - { name: platform, label: Platform, widget: string }
      - { name: plan, label: Plan, widget: string, required: false }
      - { name: disciplines, label: Disciplines, widget: select, multiple: true, options: [Web, Growth, Apps, Ops] }
      - { name: meta, label: "Meta line (industry · platform)", widget: string }
      - { name: summary, label: Card summary, widget: text }
      - { name: headline, label: Case study H1, widget: string }
      - { name: image, label: Main screenshot, widget: image, required: false }
      - { name: imageAlt, label: Main screenshot alt text, widget: string, required: false }
      - { name: url, label: Live site URL, widget: string, required: false }
      - name: results
        label: Results
        widget: list
        fields: [{ name: value, label: Value, widget: string }, { name: label, label: Label, widget: string }]
      - { name: challenge, label: The challenge, widget: text }
      - name: approach
        label: What we did
        widget: list
        fields: [{ name: discipline, label: Discipline, widget: select, options: [Web, Growth, Apps, Ops] }, { name: text, label: Text, widget: text }]
      - name: gallery
        label: Gallery
        widget: list
        fields: [{ name: src, label: Image, widget: image, required: false }, { name: alt, label: Alt text, widget: string }]
      - name: testimonial
        label: Testimonial
        widget: object
        required: false
        fields: [{ name: quote, label: Quote, widget: text }, { name: name, label: Name, widget: string }, { name: role, label: Role, widget: string }]
      - { name: tools, label: Stack, widget: list, required: false }

  - name: work_de
    label: Case studies (DE)
    folder: src/content/work/de
    create: true
    slug: "{{slug}}"
    fields: *work_fields
